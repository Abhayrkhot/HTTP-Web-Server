# hws configuration. Every option is also a command-line flag (--name value); flags win.
# Durations take ms/s/m/h, sizes take k/m/g. See `hws --help`.

listen = 0.0.0.0:8080
# workers = 0                 # 0 = one per CPU in the process affinity mask
# reuseport = on              # per-worker SO_REUSEPORT sockets (off: shared socket + EPOLLEXCLUSIVE)
# pin-workers = off

root = /srv/www
index = index.html
cache-control = public, max-age=300
# serve-dotfiles = off        # /.git, /.env, ... are 404
# follow-symlinks = on        # always confined to root by openat2(RESOLVE_BENEATH)
# file-cache-ttl = 2s         # changes on disk become visible within this long

keepalive-timeout = 60s
header-timeout = 10s          # slowloris guard: absolute deadline for a full request head
body-timeout = 30s
write-timeout = 30s           # close clients that stop reading
drain-timeout = 25s           # keep below the orchestrator's kill grace period

max-header-bytes = 16k
max-body-bytes = 1m
max-requests-per-connection = 10000

access-log = stdout
log-level = info
health-path = /healthz        # returns 503 while draining so load balancers stop routing here
metrics-path = /metrics
